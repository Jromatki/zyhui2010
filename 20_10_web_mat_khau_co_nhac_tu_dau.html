<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gargantua: Multilingual Love Meteor Vortex ✨🖤</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #04030a; }
  body { font-family: Arial, Helvetica, sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: crosshair; }
  #space { visibility: hidden; }
  #passwordGate { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; padding: 24px; background: radial-gradient(ellipse at 50% 45%, #201038 0%, #090614 48%, #04030a 100%); }
  #passwordGate::before { content: ""; position: absolute; inset: 0; pointer-events: none; background-image: radial-gradient(2px 2px at 15% 20%, #fff9 45%, transparent 60%), radial-gradient(1px 1px at 80% 25%, #b9caffaa 45%, transparent 60%), radial-gradient(2px 2px at 70% 80%, #fff8 45%, transparent 60%), radial-gradient(1px 1px at 25% 75%, #d9baffaa 45%, transparent 60%); }
  .password-card { position: relative; width: min(100%, 390px); padding: 34px 28px 28px; border: 1px solid rgba(207,174,255,.35); border-radius: 24px; background: rgba(13,9,27,.82); box-shadow: 0 0 55px rgba(151,70,255,.2), inset 0 0 24px rgba(140,80,255,.05); text-align: center; backdrop-filter: blur(12px); }
  .password-heart { font-size: 36px; margin-bottom: 10px; filter: drop-shadow(0 0 12px #d477ff); }
  .password-card h1 { margin: 0 0 10px; font-size: 24px; color: #f3e7ff; }
  .password-card p { margin: 0 0 22px; color: #bdb2d3; font-size: 14px; line-height: 1.5; }
  #passwordInput { width: 100%; padding: 14px 16px; border: 1px solid #665080; border-radius: 12px; background: #090613; color: #fff; font-size: 18px; letter-spacing: 4px; text-align: center; outline: none; }
  #passwordInput:focus { border-color: #d7a1ff; box-shadow: 0 0 0 3px #b76cff24; }
  #passwordSubmit { width: 100%; margin-top: 14px; padding: 13px 16px; border: 0; border-radius: 12px; color: #160b22; background: linear-gradient(100deg,#f2c6ff,#b99bff); font-weight: 700; font-size: 15px; cursor: pointer; }
  #passwordError { min-height: 18px; margin-top: 12px; color: #ff9dbb; font-size: 13px; }
  .hint { position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); color: rgba(225,230,255,.72); font-size: 12px; text-align: center; pointer-events: none; text-shadow: 0 1px 5px #000; width: min(96vw, 900px); }



</style>
</head>
<body>
<div id="passwordGate">
  <form class="password-card" id="passwordForm">
    <div class="password-heart">💜</div>
    <h1>Một chút bí mật</h1>
    <p>Nhập mật khẩu để mở món quà 20/10 dành riêng cho bạn nhé ✨</p>
    <input id="passwordInput" type="password" inputmode="numeric" autocomplete="off" placeholder="Nhập mật khẩu" aria-label="Mật khẩu" required>
    <button id="passwordSubmit" type="submit">Mở món quà ❤️</button>
    <div id="passwordError" role="status" aria-live="polite"></div>
  </form>
</div>

<script>
(() => {
  'use strict';
  const canvas = document.getElementById('space');
  const ctx = canvas.getContext('2d');
  const music = document.getElementById('backgroundMusic');
  music.loop = true;
  music.autoplay = true;
  music.preload = 'auto';

  // Thử phát ngay khi mở trang. Nếu trình duyệt chặn autoplay,
  // phát nhạc ở lần chạm/click hoặc nhấn phím đầu tiên (không hiện nút).
  async function tryStartMusic() {
    if (!music.paused) return;
    try {
      await music.play();
      removeStartListeners();
    } catch (error) {
      // Trình duyệt yêu cầu tương tác của người dùng; các listener bên dưới sẽ thử lại.
    }
  }
  function onFirstInteraction() { tryStartMusic(); }
  function removeStartListeners() {
    document.removeEventListener('pointerdown', onFirstInteraction, true);
    document.removeEventListener('keydown', onFirstInteraction, true);
    document.removeEventListener('touchstart', onFirstInteraction, true);
  }
  document.addEventListener('pointerdown', onFirstInteraction, true);
  document.addEventListener('keydown', onFirstInteraction, true);
  document.addEventListener('touchstart', onFirstInteraction, true);
  window.addEventListener('load', tryStartMusic);

  const passwordGate = document.getElementById('passwordGate');
  const passwordForm = document.getElementById('passwordForm');
  const passwordInput = document.getElementById('passwordInput');
  const passwordError = document.getElementById('passwordError');
  passwordForm.addEventListener('submit', async (event) => {
    event.preventDefault();
    if (passwordInput.value === '06032010') {
      passwordGate.style.display = 'none';
      canvas.style.visibility = 'visible';
      passwordError.textContent = '';
      await tryStartMusic();
    } else {
      passwordError.textContent = 'Mật khẩu chưa đúng, thử lại nhé 💗';
      passwordInput.value = '';
      passwordInput.focus();
    }
  });

  const BASE = 950;
  let width = 0, height = 0, scale = 1, dpr = 1;
  const themes = [
    { name: 'Interstellar Gold 🔥', core: [255,245,190], mid: [255,140,30], outer: [255,70,15] },
    { name: 'Cyberpunk Nebula 💜', core: [255,200,255], mid: [195,55,255], outer: [0,245,255] },
    { name: 'Quantum Horizon 💎', core: [215,255,255], mid: [0,190,255], outer: [70,70,255] },
    { name: 'Solar Flare Blood ❤️', core: [255,225,215], mid: [255,50,80], outer: [160,0,40] }
  ];
  const loveLanguages = ['I LOVE YOU','ANH YÊU EM','EM YÊU ANH','TE AMO',"JE T'AIME",'SARANGHAE','AISHITERU','WO AI NI','TI AMO','ICH LIEBE DICH'];
  let themeIndex = 0, lastTime = 0, elapsed = 0, shockwaveTimer = 0, supernovaTimer = 0;
  let mouse = {x: BASE/2, y: BASE/2, down: false};
  const rand = (a,b) => a + Math.random()*(b-a);
  const rgba = (c,a=1) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    width = window.innerWidth; height = window.innerHeight;
    canvas.width = Math.floor(width*dpr); canvas.height = Math.floor(height*dpr);
    canvas.style.width = width+'px'; canvas.style.height = height+'px';
    scale = Math.min(width, height) / BASE;
    ctx.setTransform(dpr*scale,0,0,dpr*scale,(width-BASE*scale)*dpr/2,(height-BASE*scale)*dpr/2);
  }
  function heartTarget(t, s=5) {
    const x = 16*Math.pow(Math.sin(t),3);
    const y = -(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));
    return [x*s,y*s];
  }
  class ShootingStar {
    reset() {
      if (Math.random()<.6) { this.x=rand(150,BASE+100); this.y=rand(-50,80); }
      else { this.x=rand(BASE-100,BASE+120); this.y=rand(0,BASE/2); }
      const a=rand(135*Math.PI/180,158*Math.PI/180), speed=rand(14,21);
      this.vx=Math.cos(a)*speed; this.vy=Math.sin(a)*speed;
      this.length=rand(70,130); this.active=false; this.wait=rand(.1,1.8);
    }
    constructor(){this.reset();}
    update(dt){ if(!this.active){this.wait-=dt;if(this.wait<=0)this.active=true;} else {this.x+=this.vx*dt*60;this.y+=this.vy*dt*60;if(this.x < -150 || this.y>BASE+100)this.reset();} }
    draw(c){if(!this.active)return; const n=Math.hypot(this.vx,this.vy)||1;ctx.strokeStyle=rgba(c,.8);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(this.x,this.y);ctx.lineTo(this.x-this.vx/n*this.length,this.y-this.vy/n*this.length);ctx.stroke();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(this.x,this.y,2,0,Math.PI*2);ctx.fill();}
  }
  class LoveWord {
    constructor(){this.reset(true);}
    reset(initial=false){
      this.text=loveLanguages[Math.floor(Math.random()*loveLanguages.length)];
      const a=Math.random()<.5?rand(-55*Math.PI/180,-25*Math.PI/180):rand(125*Math.PI/180,155*Math.PI/180);
      const speed=rand(1.2,2.6);this.vx=Math.cos(a)*speed;this.vy=Math.sin(a)*speed;
      if(initial){this.x=rand(50,BASE-50);this.y=rand(80,BASE-80);}
      else if(this.vx>0){this.x=rand(-150,-30);this.y=rand(100,BASE-50);}
      else {this.x=rand(BASE+30,BASE+150);this.y=rand(50,BASE-150);}
      this.alpha=rand(140,225);this.rotation=a*180/Math.PI*.4;
    }
    update(dt){this.x+=this.vx*dt*60;this.y+=this.vy*dt*60;if(this.x < -180||this.x>BASE+180||this.y < -80||this.y>BASE+80)this.reset();}
    draw(color){ctx.save();ctx.translate(this.x,this.y);ctx.rotate(-this.rotation*Math.PI/180);ctx.globalAlpha=this.alpha/255;ctx.fillStyle=rgba(color);ctx.font='bold 13px Arial, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(this.text,0,0);ctx.restore();}
  }
  class Shockwave {
    constructor(color){this.color=color;this.s=4.5;this.max=32;this.alpha=240;this.dead=false;}
    update(dt){this.s+=.45*60*dt;const p=(this.s-4.5)/(this.max-4.5);this.alpha=Math.max(0,240*(1-Math.pow(p,.8)));if(this.s>=this.max||this.alpha<=0)this.dead=true;}
    draw(){if(this.dead||this.alpha<=2)return;const pts=[];for(let d=0;d<360;d+=6){const [x,y]=heartTarget(d*Math.PI/180,this.s);pts.push([BASE/2+x,BASE/2+y*.58]);}ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.lineJoin='round';ctx.strokeStyle=rgba(this.color,this.alpha/255*.45);ctx.lineWidth=5;ctx.stroke();ctx.strokeStyle=`rgba(255,255,255,${this.alpha/255})`;ctx.lineWidth=2;ctx.stroke();}
  }
  class Photon {
    constructor(){this.t=rand(0,Math.PI*2);this.layer=rand(.4,3.4);this.orbit=rand(.02,.055)/Math.sqrt(this.layer);this.tilt=.58;this.z=rand(-16,16);this.vx=0;this.vy=0;this.size=rand(1.2,2.5);this.px=null;this.py=null;}
    update(dt,mx,my,collapsing,supernova){this.t=(this.t+this.orbit*dt*60)%(Math.PI*2);const [hx,hy]=heartTarget(this.t,5*this.layer);const tx=BASE/2+hx,ty=BASE/2+(hy*Math.cos(this.tilt)-this.z*Math.sin(this.tilt));const dx=mx-tx,dy=my-ty,distSq=dx*dx+dy*dy+350,dist=Math.sqrt(distSq);
      if(collapsing){const pull=7500/distSq;this.vx+=(dx/dist)*pull*1.8*dt*60;this.vy+=(dy/dist)*pull*1.8*dt*60;}
      else if(supernova){const push=16000/distSq;this.vx-=(dx/dist)*push*dt*60;this.vy-=(dy/dist)*push*dt*60;}
      else if(dist<200){const f=(200-dist)*.05*dt*60;this.vx+=(-dy/dist)*f;this.vy+=(dx/dist)*f;}
      this.vx*=Math.pow(.90,dt*60);this.vy*=Math.pow(.90,dt*60);return [tx+this.vx,ty+this.vy];}
  }
  const stars=Array.from({length:160},()=>({x:rand(0,BASE),y:rand(0,BASE),r:rand(.6,2),speed:rand(.6,2.4),phase:rand(0,Math.PI*2)}));
  const shooting=Array.from({length:5},()=>new ShootingStar());
  const words=Array.from({length:24},()=>new LoveWord());
  const photons=Array.from({length:2400},()=>new Photon());
  let waves=[];
  function draw(now){
    const dt=Math.min((now-lastTime)/1000||0, .04);lastTime=now;elapsed+=dt;
    const theme=themes[themeIndex];
    // Motion blur trail, similar to the original Pygame effect.
    ctx.fillStyle='rgba(4,3,10,0.20)';ctx.fillRect(0,0,BASE,BASE);
    for(const s of stars){const a=(Math.sin(elapsed*s.speed*20+s.phase)+1)*.27+.16;ctx.fillStyle=`rgba(190,210,240,${a})`;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();}
    for(const s of shooting){s.update(dt);s.draw(theme.core);}
    shockwaveTimer+=dt;if(shockwaveTimer>.75){waves.push(new Shockwave(theme.mid));shockwaveTimer=0;}
    for(const w of waves){w.update(dt);w.draw();}waves=waves.filter(w=>!w.dead);
    for(const word of words){word.update(dt);word.draw(theme.core);}
    const mx=(mouse.x-(width-BASE*scale)/2)/scale, my=(mouse.y-(height-BASE*scale)/2)/scale;
    for(const p of photons){const [x,y]=p.update(dt,mx,my,mouse.down,supernovaTimer>0);if(p.px!==null){const c=p.layer<1.2?theme.core:p.layer<2.2?theme.mid:theme.outer;ctx.strokeStyle=rgba(c,.8);ctx.lineWidth=p.size;ctx.beginPath();ctx.moveTo(p.px,p.py);ctx.lineTo(x,y);ctx.stroke();}p.px=x;p.py=y;}
    const pulse=1+Math.sin(elapsed*4.2)*.06, pts=[];for(let d=0;d<360;d+=6){const [hx,hy]=heartTarget(d*Math.PI/180,4.2*pulse);pts.push([BASE/2+hx,BASE/2+hy*.58]);}
    ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fillStyle='#000';ctx.fill();ctx.strokeStyle=rgba(theme.core);ctx.lineWidth=3;ctx.stroke();
    if(mouse.down){const r=22+Math.sin(elapsed*20)*7;ctx.strokeStyle=rgba(theme.core);ctx.lineWidth=2;ctx.beginPath();ctx.arc(mx,my,r,0,Math.PI*2);ctx.stroke();ctx.strokeStyle=rgba(theme.mid);ctx.lineWidth=1;ctx.beginPath();ctx.arc(mx,my,r+12,0,Math.PI*2);ctx.stroke();}
    ctx.textAlign='center';ctx.textBaseline='middle';ctx.font="bold 24px Arial, 'Segoe UI', sans-serif";ctx.fillStyle=rgba(theme.core);ctx.fillText('Chúc Zy húi yêu yêu của anh Rex 20-10 vui vẻ ngày càng xinh đẹp và ngày càng yêu chồng hơnn ❤️',BASE/2,48,BASE-28);
    ctx.font='15px Trebuchet MS, Arial, sans-serif';ctx.fillStyle='rgba(220,220,235,.95)';ctx.fillText('Di chuột: Uốn cong dòng hạt | Giữ chuột: Hút sụp đổ | Nhả chuột: Nổ Supernova',BASE/2,BASE-65);
    ctx.fillStyle=rgba(theme.mid);ctx.fillText(`Phím [ SPACE ]: Chiều không gian — Hiện tại: ${theme.name}`,BASE/2,BASE-40);
    if(supernovaTimer>0)supernovaTimer=Math.max(0,supernovaTimer-dt);
    requestAnimationFrame(draw);
  }
  function point(e){const r=canvas.getBoundingClientRect();mouse.x=e.clientX-r.left;mouse.y=e.clientY-r.top;}
  canvas.addEventListener('pointermove',point);
  canvas.addEventListener('pointerdown',e=>{point(e);mouse.down=true;canvas.setPointerCapture?.(e.pointerId);});
  canvas.addEventListener('pointerup',e=>{point(e);if(mouse.down){mouse.down=false;supernovaTimer=1.2;waves.push(new Shockwave([255,255,255]));}});
  canvas.addEventListener('pointercancel',()=>mouse.down=false);
  window.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();themeIndex=(themeIndex+1)%themes.length;}if(e.key==='Escape'){mouse.down=false;supernovaTimer=0;}});
  window.addEventListener('resize',resize);
  resize();ctx.fillStyle='#04030a';ctx.fillRect(0,0,BASE,BASE);requestAnimationFrame(draw);
})();
</script>
</body>
</html>
